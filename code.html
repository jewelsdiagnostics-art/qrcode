<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px;
            border-radius: 10px 10px 0 0;
            margin: -20px -20px 20px -20px;
        }
        .input-field {
            width: 80%;
            height: 40px;
            margin: 10px auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: block;
        }
        .file-input {
            width: 80%;
            margin: 10px auto;
            padding: 10px;
            display: block;
        }
        .style-section {
            margin: 15px auto;
            width: 80%;
            text-align: left;
        }
        .style-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .style-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .style-btn {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            background: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }
        .style-btn.active {
            border-color: #4CAF50;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }
        .style-btn:hover {
            border-color: #4CAF50;
        }
        .color-picker-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
        }
        .color-picker-row div {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .bg-removal-section {
            margin: 10px auto;
            width: 80%;
            text-align: left;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }
        .bg-removal-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        .bg-removal-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .bg-removal-row input[type="color"] {
            width: 40px;
            height: 30px;
            border: none;
            cursor: pointer;
        }
        .bg-removal-row span {
            font-size: 13px;
            color: #666;
        }
        .bg-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .bg-toggle input {
            cursor: pointer;
        }
        .threshold-slider {
            width: 100px;
        }
        .position-section {
            margin: 10px auto;
            width: 80%;
            text-align: left;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }
        .position-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 120px;
            margin: 0 auto;
        }
        .pos-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            background: #fff;
            font-size: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pos-btn:hover {
            border-color: #4CAF50;
            background: #e8f5e9;
        }
        .pos-btn.active {
            border-color: #4CAF50;
            background: #4CAF50;
            color: #fff;
            font-weight: bold;
        }
        .generate-btn {
            width: 200px;
            height: 40px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }
        .generate-btn:hover {
            background-color: #3e8e41;
        }
        #qr-code {
            margin: 20px auto;
            display: inline-block;
            position: relative;
        }
        .download-btn {
            display: none;
            width: 200px;
            height: 40px;
            background-color: #2196F3;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px auto;
            font-size: 16px;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .download-btn:hover {
            background-color: #1976D2;
        }
        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        .preview-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px auto;
            flex-wrap: wrap;
        }
        .preview-box {
            text-align: center;
        }
        .preview-box p {
            margin: 5px 0;
            font-size: 12px;
            color: #666;
        }
        .preview-box canvas {
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QR Code Generator</h1>
        </div>
        <input type="text" id="link" class="input-field" placeholder="Enter link">
        <input type="file" id="image" class="file-input" accept="image/*">

        <div class="style-section">
            <label>QR Style</label>
            <div class="style-btns">
                <button class="style-btn active" id="styleStandard" onclick="setStyle('standard')">Standard</button>
                <button class="style-btn" id="styleRounded" onclick="setStyle('rounded')">Rounded</button>
            </div>

            <label>Colors</label>
            <div class="color-picker-row">
                <div>
                    <label for="fgColor">Foreground:</label>
                    <input type="color" id="fgColor" value="#000000">
                </div>
                <div>
                    <label for="bgColor">Background:</label>
                    <input type="color" id="bgColor" value="#ffffff">
                </div>
            </div>
        </div>

        <div class="bg-removal-section">
            <label>Background Removal</label>
            <div class="bg-removal-row">
                <label class="bg-toggle">
                    <input type="checkbox" id="removeBg" checked>
                    Remove background
                </label>
                <span>| Target color:</span>
                <input type="color" id="targetColor" value="#ffffff" title="Click the dominant background color in your image">
                <span>| Tolerance:</span>
                <input type="range" id="tolerance" class="threshold-slider" min="0" max="100" value="30">
                <span id="toleranceValue">30</span>
            </div>
            <p style="font-size: 12px; color: #888; margin: 5px 0 0 0;">
                Tip: Use the color picker to select your image's background color. Increase tolerance for gradients.
            </p>
        </div>

        <div class="position-section">
            <label>Logo Position</label>
            <div class="position-grid">
                <button class="pos-btn" data-pos="top-left" onclick="setPosition('top-left')">TL</button>
                <button class="pos-btn" data-pos="top-center" onclick="setPosition('top-center')">TC</button>
                <button class="pos-btn" data-pos="top-right" onclick="setPosition('top-right')">TR</button>
                <button class="pos-btn" data-pos="center-left" onclick="setPosition('center-left')">CL</button>
                <button class="pos-btn active" data-pos="center" onclick="setPosition('center')">C</button>
                <button class="pos-btn" data-pos="center-right" onclick="setPosition('center-right')">CR</button>
                <button class="pos-btn" data-pos="bottom-left" onclick="setPosition('bottom-left')">BL</button>
                <button class="pos-btn" data-pos="bottom-center" onclick="setPosition('bottom-center')">BC</button>
                <button class="pos-btn" data-pos="bottom-right" onclick="setPosition('bottom-right')">BR</button>
            </div>
        </div>

        <button class="generate-btn" onclick="generateQRCode()">Generate QR Code</button>

        <div class="preview-container" id="previewContainer" style="display:none;">
            <div class="preview-box">
                <p>Original</p>
                <canvas id="originalPreview" width="100" height="100"></canvas>
            </div>
            <div class="preview-box">
                <p>Background Removed</p>
                <canvas id="processedPreview" width="100" height="100"></canvas>
            </div>
        </div>

        <div id="qr-code"></div>
        <button class="download-btn" id="downloadBtn" onclick="downloadQRCode()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Download QR Code
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let currentQRCode = null;
        let currentStyle = 'standard';
        let currentPosition = 'center';
        let processedImage = null;

        document.getElementById('tolerance').addEventListener('input', function() {
            document.getElementById('toleranceValue').textContent = this.value;
        });

        function setStyle(style) {
            currentStyle = style;
            document.getElementById('styleStandard').classList.toggle('active', style === 'standard');
            document.getElementById('styleRounded').classList.toggle('active', style === 'rounded');
        }

        function setPosition(pos) {
            currentPosition = pos;
            document.querySelectorAll('.pos-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.pos === pos);
            });
        }

        function getPositionCoords(canvasWidth, canvasHeight, logoSize) {
            const positions = {
                'top-left': { x: logoSize / 2 + 20, y: logoSize / 2 + 20 },
                'top-center': { x: canvasWidth / 2, y: logoSize / 2 + 20 },
                'top-right': { x: canvasWidth - logoSize / 2 - 20, y: logoSize / 2 + 20 },
                'center-left': { x: logoSize / 2 + 20, y: canvasHeight / 2 },
                'center': { x: canvasWidth / 2, y: canvasHeight / 2 },
                'center-right': { x: canvasWidth - logoSize / 2 - 20, y: canvasHeight / 2 },
                'bottom-left': { x: logoSize / 2 + 20, y: canvasHeight - logoSize / 2 - 20 },
                'bottom-center': { x: canvasWidth / 2, y: canvasHeight - logoSize / 2 - 20 },
                'bottom-right': { x: canvasWidth - logoSize / 2 - 20, y: canvasHeight - logoSize / 2 - 20 }
            };
            return positions[currentPosition] || positions['center'];
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        function colorDistance(r1, g1, b1, r2, g2, b2) {
            return Math.sqrt(
                Math.pow(r1 - r2, 2) + 
                Math.pow(g1 - g2, 2) + 
                Math.pow(b1 - b2, 2)
            );
        }

        function removeBackground(imageData, targetColor, tolerance) {
            const data = imageData.data;
            const target = hexToRgb(targetColor);
            const maxDistance = tolerance * 2.55;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                const dist = colorDistance(r, g, b, target.r, target.g, target.b);

                if (dist < maxDistance) {
                    data[i + 3] = 0;
                } else {
                    const featherRange = 20;
                    if (dist < maxDistance + featherRange) {
                        const alpha = Math.round(255 * (dist - maxDistance) / featherRange);
                        data[i + 3] = Math.min(255, Math.max(0, alpha));
                    }
                }
            }
            return imageData;
        }

        function processImage(img, targetColor, tolerance) {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            imageData = removeBackground(imageData, targetColor, tolerance);
            ctx.putImageData(imageData, 0, 0);

            return canvas;
        }

        function generateQRCode() {
            const link = document.getElementById('link').value;
            const image = document.getElementById('image').files[0];
            const qrContainer = document.getElementById('qr-code');
            const downloadBtn = document.getElementById('downloadBtn');
            const fgColor = document.getElementById('fgColor').value;
            const bgColor = document.getElementById('bgColor').value;
            const removeBg = document.getElementById('removeBg').checked;
            const targetColor = document.getElementById('targetColor').value;
            const tolerance = parseInt(document.getElementById('tolerance').value);

            if (!link) {
                alert('Please enter a link');
                return;
            }

            qrContainer.innerHTML = '';
            downloadBtn.style.display = 'none';
            currentQRCode = null;
            processedImage = null;

            const tempDiv = document.createElement('div');
            new QRCode(tempDiv, {
                text: link,
                width: 256,
                height: 256,
                colorDark: fgColor,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const tempCanvas = tempDiv.querySelector('canvas');
                if (!tempCanvas) return;

                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = 512;
                finalCanvas.height = 512;
                const ctx = finalCanvas.getContext('2d');

                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                ctx.drawImage(tempCanvas, 0, 0, 512, 512);

                if (currentStyle === 'rounded') {
                    applyRoundedStyle(ctx, 512, 512, fgColor);
                }

                if (image) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = new Image();
                        img.src = event.target.result;
                        img.onload = function() {
                            const previewContainer = document.getElementById('previewContainer');
                            const origPreview = document.getElementById('originalPreview');
                            const procPreview = document.getElementById('processedPreview');

                            const origCtx = origPreview.getContext('2d');
                            origCtx.clearRect(0, 0, 100, 100);
                            const scale = Math.min(100 / img.width, 100 / img.height);
                            const origW = img.width * scale;
                            const origH = img.height * scale;
                            origCtx.drawImage(img, (100 - origW) / 2, (100 - origH) / 2, origW, origH);

                            let logoCanvas;
                            if (removeBg) {
                                logoCanvas = processImage(img, targetColor, tolerance);
                            } else {
                                logoCanvas = document.createElement('canvas');
                                logoCanvas.width = img.width;
                                logoCanvas.height = img.height;
                                const logoCtx = logoCanvas.getContext('2d');
                                logoCtx.drawImage(img, 0, 0);
                            }
                            processedImage = logoCanvas;

                            const procCtx = procPreview.getContext('2d');
                            procCtx.clearRect(0, 0, 100, 100);
                            const procScale = Math.min(100 / logoCanvas.width, 100 / logoCanvas.height);
                            const procW = logoCanvas.width * procScale;
                            const procH = logoCanvas.height * procScale;
                            procCtx.drawImage(logoCanvas, (100 - procW) / 2, (100 - procH) / 2, procW, procH);

                            previewContainer.style.display = 'flex';

                            const logoSize = finalCanvas.width * 0.35;
                            const pos = getPositionCoords(finalCanvas.width, finalCanvas.height, logoSize);
                            const drawX = pos.x - logoSize / 2;
                            const drawY = pos.y - logoSize / 2;

                            // NO black ring — just draw the image directly with transparent background
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(pos.x, pos.y, logoSize / 2, 0, Math.PI * 2);
                            ctx.clip();
                            ctx.drawImage(logoCanvas, drawX, drawY, logoSize, logoSize);
                            ctx.restore();

                            qrContainer.appendChild(finalCanvas);
                            currentQRCode = finalCanvas;
                            downloadBtn.style.display = 'inline-flex';
                        };
                    };
                    reader.readAsDataURL(image);
                } else {
                    qrContainer.appendChild(finalCanvas);
                    currentQRCode = finalCanvas;
                    downloadBtn.style.display = 'inline-flex';
                }
            }, 100);
        }

        function applyRoundedStyle(ctx, width, height, color) {
            const cornerRadius = 20;
            ctx.globalCompositeOperation = 'destination-out';

            ctx.beginPath();
            ctx.moveTo(0, cornerRadius);
            ctx.quadraticCurveTo(0, 0, cornerRadius, 0);
            ctx.lineTo(0, 0);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(width - cornerRadius, 0);
            ctx.quadraticCurveTo(width, 0, width, cornerRadius);
            ctx.lineTo(width, 0);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, height - cornerRadius);
            ctx.quadraticCurveTo(0, height, cornerRadius, height);
            ctx.lineTo(0, height);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(width - cornerRadius, height);
            ctx.quadraticCurveTo(width, height, width, height - cornerRadius);
            ctx.lineTo(width, height);
            ctx.fill();

            ctx.globalCompositeOperation = 'source-over';
        }

        function downloadQRCode() {
            if (!currentQRCode) return;

            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = currentQRCode.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
